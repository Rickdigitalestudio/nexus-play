<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" width="520" height="500">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2408"/>
      <stop offset=".55" stop-color="#251104"/>
      <stop offset="1" stop-color="#0E0702"/>
    </linearGradient>
    <radialGradient id="mLamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFC46B" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mStreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <rect width="520" height="500" fill="url(#mBg)"/>

  <!-- lâmpadas do teto -->
  <g>
    <circle cx="130" cy="86" r="60" fill="url(#mLamp)"/>
    <circle cx="330" cy="66" r="60" fill="url(#mLamp)"/>
    <circle cx="460" cy="100" r="46" fill="url(#mLamp)"/>
    <rect x="122" y="60" width="16" height="12" rx="4" fill="#FFE2B0"/>
    <rect x="322" y="40" width="16" height="12" rx="4" fill="#FFE2B0"/>
    <rect x="453" y="76" width="14" height="10" rx="4" fill="#FFE2B0"/>
  </g>

  <!-- estrutura da estação -->
  <g fill="#170B03">
    <rect x="0" y="120" width="520" height="26"/>
    <rect x="60" y="146" width="22" height="180"/>
    <rect x="266" y="146" width="22" height="180"/>
    <rect x="452" y="146" width="22" height="180"/>
  </g>
  <!-- placa -->
  <rect x="180" y="152" width="120" height="40" rx="8" fill="#0F0602" stroke="#FFB347" stroke-width="3"/>
  <g fill="#FFB347" font-family="sans-serif" font-size="17" font-weight="700">
    <text x="200" y="178">LINHA 7</text>
  </g>

  <!-- trilhos em perspectiva -->
  <g stroke="#3A1D08" stroke-width="10">
    <path d="M150 500 240 328M370 500 280 328"/>
  </g>
  <g stroke="#241204" stroke-width="7">
    <path d="M170 470h180M186 440h148M200 414h120M212 392h96M222 372h76M230 356h60"/>
  </g>

  <!-- trem passando (rastros) -->
  <g>
    <rect x="300" y="236" width="220" height="86" rx="18" fill="#2E1505"/>
    <rect x="316" y="252" width="46" height="34" rx="8" fill="#FFD9A8" opacity=".95"/>
    <rect x="374" y="252" width="46" height="34" rx="8" fill="#FFD9A8" opacity=".55"/>
    <rect x="432" y="252" width="46" height="34" rx="8" fill="#FFD9A8" opacity=".28"/>
    <rect x="60" y="262" width="210" height="10" rx="5" fill="url(#mStreak)"/>
    <rect x="20" y="292" width="240" height="8" rx="4" fill="url(#mStreak)" opacity=".7"/>
    <rect x="90" y="318" width="180" height="6" rx="3" fill="url(#mStreak)" opacity=".5"/>
  </g>

  <!-- passageiro -->
  <g fill="#0B0401">
    <circle cx="118" cy="300" r="13"/>
    <path d="M106 318c9-6 20-6 26 0l8 44-12 6-5-18-2 50h-16l-2-54-10 22-12-10z"/>
  </g>
  <rect x="0" y="326" width="520" height="14" fill="#1C0E04"/>
</svg>
